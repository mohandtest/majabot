[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "majabot"
version = "0.1.0"
description = "A Zulip chatbot powered by Ollama"
requires-python = ">=3.9"
dependencies = [
    "zulip-bots",
    "requests>=2.31.0",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
